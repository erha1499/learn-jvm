<title>JVM 交互学习手册</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* 布局：左侧目录（单元 → 小节），右侧一次显示一个单元。
   正文是一栏可读宽度；“动手”演示是正文里的卡片：上面旁白和控制，下面左代码、右运行状态。 */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --panel:#f6f8fb; --surface-2:#e8ecf2; --ink:#152033; --ink-2:#47546c; --ink-3:#76829a;
  --line:#d4dae4; --line-2:#b9c3d2;
  --accent:#2b55c4; --accent-ink:#ffffff; --accent-bg:rgba(43,85,196,.09);
  --t1:#2b55c4; --t2:#b13a6d; --t3:#0d8475; --t4:#8a5a22; --on-th:#ffffff;
  --ok:#1b8447; --bad:#c2352c; --wait:#9a650b; --idle:#6f7b91;
  --ok-bg:rgba(27,132,71,.11); --bad-bg:rgba(194,53,44,.10); --wait-bg:rgba(162,106,12,.13); --idle-bg:rgba(111,123,145,.13);
  --c-kw:#8b2fa6; --c-str:#b0482a; --c-com:#76829a; --c-num:#0d7f70; --c-ty:#1d5c9c;
  --code-bg:#f6f8fb;
  --k-mark:#2b55c4; --k-klass:#0d8475; --k-len:#8a5a22; --k-field:#1b8447; --k-ref:#b13a6d; --k-pad:#9aa5b7;
  --n-grey:#a3adbd; --n-black:#1d2433; --n-black-ink:#ffffff;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#151c27; --panel:#1a2230; --surface-2:#212b39; --ink:#e4e9f1; --ink-2:#a6b1c3; --ink-3:#7d899d;
    --line:#2a3443; --line-2:#3d495b;
    --accent:#86a6ff; --accent-ink:#0d1219; --accent-bg:rgba(134,166,255,.12);
    --t1:#86a6ff; --t2:#f08bb6; --t3:#4fcfbd; --t4:#d9a46a; --on-th:#0d1219;
    --ok:#5bc98a; --bad:#ff7a70; --wait:#f0b350; --idle:#8e9ab0;
    --ok-bg:rgba(91,201,138,.14); --bad-bg:rgba(255,122,112,.13); --wait-bg:rgba(240,179,80,.14); --idle-bg:rgba(142,154,176,.15);
    --c-kw:#d39bf0; --c-str:#f0a080; --c-com:#7d899d; --c-num:#5fd3c2; --c-ty:#8cbcf0;
    --code-bg:#121923;
    --k-mark:#86a6ff; --k-klass:#4fcfbd; --k-len:#d9a46a; --k-field:#5bc98a; --k-ref:#f08bb6; --k-pad:#5a667a;
    --n-grey:#6b778b; --n-black:#000000; --n-black-ink:#e4e9f1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#151c27; --panel:#1a2230; --surface-2:#212b39; --ink:#e4e9f1; --ink-2:#a6b1c3; --ink-3:#7d899d;
  --line:#2a3443; --line-2:#3d495b;
  --accent:#86a6ff; --accent-ink:#0d1219; --accent-bg:rgba(134,166,255,.12);
  --t1:#86a6ff; --t2:#f08bb6; --t3:#4fcfbd; --t4:#d9a46a; --on-th:#0d1219;
  --ok:#5bc98a; --bad:#ff7a70; --wait:#f0b350; --idle:#8e9ab0;
  --ok-bg:rgba(91,201,138,.14); --bad-bg:rgba(255,122,112,.13); --wait-bg:rgba(240,179,80,.14); --idle-bg:rgba(142,154,176,.15);
  --c-kw:#d39bf0; --c-str:#f0a080; --c-com:#7d899d; --c-num:#5fd3c2; --c-ty:#8cbcf0;
  --code-bg:#121923;
  --k-mark:#86a6ff; --k-klass:#4fcfbd; --k-len:#d9a46a; --k-field:#5bc98a; --k-ref:#f08bb6; --k-pad:#5a667a;
  --n-grey:#6b778b; --n-black:#000000; --n-black-ink:#e4e9f1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.75; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 64px}
h1,h2,h3{text-wrap:balance}
button{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
code,.mono{font-family:var(--f-mono)}

/* ---------- 骨架 ---------- */
.app{max-width:1260px; margin:0 auto; display:grid; grid-template-columns:250px minmax(0, 1fr); gap:40px}
.side{position:sticky; top:env(safe-area-inset-top, 0px); align-self:start; max-height:100vh; overflow:auto; padding-block:28px 24px; font-size:14px}
.brand{display:block; font-family:var(--f-display); font-weight:900; font-size:19px; color:var(--ink); text-decoration:none; line-height:1.3}
.toc-btn{display:none}
.toc{display:grid; gap:2px; margin-top:18px}
.toc a{text-decoration:none; color:var(--ink-2); border-radius:7px; padding:4px 8px; display:block}
.toc a:hover{background:var(--surface)}
.toc .toc-u{font-weight:700; color:var(--ink); display:flex; gap:8px; align-items:baseline}
.toc .toc-n{font:600 11px var(--f-mono); color:var(--ink-3); flex:none}
.toc .toc-u.on{background:var(--surface); box-shadow:inset 3px 0 0 var(--accent)}
.toc-s{list-style:none; margin:2px 0 8px; padding:0 0 0 14px; display:none; font-size:13px; line-height:1.5}
.toc-unit.open .toc-s{display:grid; gap:1px}
.toc-s a{padding:3px 8px}
.toc-s a.on{color:var(--accent); background:var(--accent-bg)}
.side-foot{margin-top:18px; font-size:12.5px; color:var(--ink-3); display:flex; gap:12px; flex-wrap:wrap; padding:0 8px}
.side-foot a{color:var(--ink-3)}
.main{min-width:0; padding-block:36px 0}
.view{min-width:0}
@media (max-width: 980px){
  .app{grid-template-columns:minmax(0, 1fr); gap:0}
  .side{position:static; max-height:none; padding-block:18px 8px; border-bottom:1px solid var(--line)}
  .side-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .toc-btn{display:inline-block}
  .toc{display:none}
  .side.open .toc{display:grid}
  .side-foot{display:none}
  .side.open .side-foot{display:flex}
  .main{padding-top:20px}
}

/* ---------- 正文 ---------- */
.prose{font-size:16px; line-height:1.85}
.prose > *{max-width:860px}
.prose p, .prose li{max-width:44em}
.prose p{margin:12px 0}
.prose h2{font-family:var(--f-display); font-weight:900; font-size:clamp(21px, 2.6vw, 25px); line-height:1.35; margin:52px 0 14px; padding-top:18px; border-top:1px solid var(--line)}
.prose section{scroll-margin-top:16px}
.prose ul,.prose ol{padding-left:1.4em; margin:10px 0}
.prose li{margin:5px 0}
.prose li::marker{color:var(--ink-3)}
.prose strong{font-weight:700; color:var(--ink)}
.prose :not(pre) > code{font-size:.84em; background:var(--surface-2); padding:1px 5px; border-radius:4px; word-break:break-word}
.prose blockquote{margin:12px 0; padding:10px 16px; border-left:3px solid var(--line-2); color:var(--ink-2); background:var(--surface); border-radius:0 8px 8px 0}
pre.codeblock{position:relative; background:var(--code-bg); border:1px solid var(--line); border-radius:10px; padding:14px 16px; overflow-x:auto; font:13px/1.7 var(--f-mono); margin:14px 0; max-width:860px}
pre.codeblock code{background:none; padding:0; font-size:inherit; white-space:pre}
pre.codeblock[data-lang="text"]{color:var(--ink-2)}
.copy{position:sticky; float:right; left:0; top:0; margin:-6px -8px 0 8px; font:12px var(--f-body); border:1px solid var(--line-2); background:var(--surface); color:var(--ink-3); border-radius:6px; padding:1px 8px; cursor:pointer}
.copy:hover{color:var(--accent); border-color:var(--accent)}
.tbl{overflow-x:auto; margin:14px 0; max-width:860px}
.tbl table{border-collapse:collapse; width:100%; font-size:14.5px; line-height:1.6; background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
.tbl th{background:var(--surface-2); font-weight:700}
.fig{margin:18px 0; max-width:860px}
.fig img{display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:12px}
.c-kw{color:var(--c-kw)} .c-str{color:var(--c-str)} .c-com{color:var(--c-com); font-style:italic} .c-num{color:var(--c-num)} .c-ty{color:var(--c-ty)}

.u-head{display:grid; gap:6px; margin-bottom:8px}
.u-no{font:600 12px var(--f-mono); color:var(--accent); letter-spacing:.08em}
.u-head h1{font-family:var(--f-display); font-weight:900; font-size:clamp(30px, 4.4vw, 42px); line-height:1.2; margin:0}
.u-sub{margin:0; color:var(--ink-2); font-size:17px}
.core{border-left:3px solid var(--accent); padding:2px 0 2px 14px; font-size:16.5px}
.goals{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 18px; display:grid; gap:6px; margin:14px 0}
.g-h{font-weight:700; font-size:14px; color:var(--ink-2)}
.goals ul{margin:0; padding-left:1.3em} .goals li{margin:3px 0; font-size:15px}
.hint{color:var(--ink-3); font-size:14px}
details.qa{border:1px solid var(--line); border-radius:12px; background:var(--surface); margin:10px 0; max-width:860px}
details.qa summary{cursor:pointer; padding:12px 16px; font-weight:700; list-style:none; display:flex; gap:10px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"展开"; flex:none; font:600 11px var(--f-mono); color:var(--accent); background:var(--accent-bg); border-radius:5px; padding:1px 7px}
details.qa[open] summary::before{content:"收起"}
details.qa .ans{padding:0 16px 14px; color:var(--ink-2); max-width:none}
.quizlist{list-style:none; padding:0; counter-reset:q; display:grid; gap:10px; max-width:860px}
.qz{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; display:grid; gap:8px; counter-increment:q; max-width:none}
.qz-q{font-weight:700}
.qz-q::before{content:counter(q) ". "; color:var(--ink-3); font-family:var(--f-mono)}
.qz-act{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.qz-ok{font-size:14px; color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.qz.done{border-color:var(--ok)}
.qz-a{color:var(--ink-2); border-top:1px dashed var(--line-2); padding-top:8px}
.qz-progress{color:var(--ok); font-weight:700}
details.deep{border:1px dashed var(--line-2); border-radius:12px; background:var(--surface); margin:18px 0; max-width:860px}
details.deep > summary{cursor:pointer; padding:10px 16px; list-style:none; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline}
details.deep > summary::-webkit-details-marker{display:none}
.deep-tag{flex:none; font:600 11px var(--f-mono); color:var(--idle); background:var(--idle-bg); border-radius:5px; padding:1px 7px}
.deep-t{font-weight:700; color:var(--ink-2)}
.deep-hint{margin-left:auto; font-size:12.5px; color:var(--ink-3)}
details.deep[open] > summary{border-bottom:1px dashed var(--line-2)}
details.deep[open] > summary .deep-hint{display:none}
.deep-b{padding:6px 16px 14px}
.deep-b > *{max-width:none}
.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:56px; padding-top:18px; border-top:1px solid var(--line); max-width:860px}
.pager a{text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; display:grid; min-width:0}
.pager a span{font:600 11px var(--f-mono); color:var(--ink-3)}
.pager a b{color:var(--ink)}
.pager a:hover{border-color:var(--accent)}

/* ---------- 首页 ---------- */
.home-hero{display:grid; gap:12px; max-width:860px; margin-bottom:12px}
.eyebrow{font:600 12px var(--f-mono); letter-spacing:.08em; color:var(--ink-3)}
.home-hero h1{font-family:var(--f-display); font-weight:900; font-size:clamp(32px, 5vw, 48px); line-height:1.15; margin:0}
.lead{margin:0; color:var(--ink-2); font-size:17px}
.unitmap{list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px}
.unitmap a{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:3px; align-content:start; font-size:14px; line-height:1.55; text-decoration:none; color:var(--ink); height:100%}
.unitmap a:hover{border-color:var(--accent)}
.unitmap .un{font:600 11px var(--f-mono); color:var(--ink-3)}
.unitmap .nm{font-weight:700; font-size:15px}
.unitmap .mt{color:var(--ink-2); font-size:13px}

/* ---------- 演示卡片 ---------- */
.lab{margin:26px 0; border:1px solid var(--line-2); border-radius:14px; background:var(--surface); padding:16px 18px 18px; display:grid; gap:14px; container-type:inline-size; max-width:none; transition:border-color .2s, box-shadow .2s}
.lab.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg)}
.lab > *{min-width:0}
.lab-top{display:grid; gap:4px}
.lab-kind{font:600 11.5px var(--f-mono); color:var(--accent); letter-spacing:.06em}
.lab-title{font-size:18px; margin:0; line-height:1.4}
.lab-intro{margin:0; color:var(--ink-2); font-size:14.5px; line-height:1.7}
.narr{display:grid; gap:2px; min-height:96px; background:var(--panel); border-radius:10px; padding:10px 14px}
.narr-k{font:600 11.5px var(--f-mono); color:var(--ink-3)}
.narr-t{font-size:16px; font-weight:700; margin:0; line-height:1.5}
.narr-p{margin:0; color:var(--ink-2); font-size:14.5px; line-height:1.7}
.narr-p b{color:var(--ink)}
.narr-p code{font-size:.88em; background:var(--surface-2); padding:0 4px; border-radius:4px}
.ctrl{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:14px; white-space:nowrap; line-height:1.6}
.btn.sm{font-size:13px; padding:2px 10px}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.07); color:var(--accent-ink)}
.btn.ghost{border-color:transparent; color:var(--ink-3)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line-2); border-radius:9px; padding:2px; gap:2px; background:var(--surface-2)}
.seg button{border:0; background:transparent; border-radius:7px; padding:4px 11px; cursor:pointer; font-size:13.5px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dots{list-style:none; margin:0; padding:0; display:flex; gap:4px; flex-wrap:wrap}
.dots button{width:24px; height:6px; border-radius:3px; border:0; background:var(--line); cursor:pointer; padding:0}
.dots button.on{background:var(--accent)} .dots button.past{background:var(--line-2)}
.bench{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.25fr); gap:14px; align-items:start}
.bench.stack{grid-template-columns:minmax(0, 1fr)}
@container (max-width: 720px){ .bench{grid-template-columns:minmax(0, 1fr)} }
@media (max-width: 640px){ .bench{grid-template-columns:minmax(0, 1fr)} }
.code-col{display:grid; gap:10px; min-width:0}
.stage{min-width:0}
.code{background:var(--code-bg); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.code-h{font:600 11.5px var(--f-mono); color:var(--ink-3); padding:6px 12px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.code-b{position:relative; max-height:360px; overflow:auto; padding:6px 0; font:12.5px/1.75 var(--f-mono)}
.ln{display:flex; align-items:center; white-space:pre; min-width:100%; width:max-content; padding-right:10px}
.ln .no{flex:none; width:2.8em; color:var(--ink-3); text-align:right; padding-right:12px; opacity:.6; user-select:none; font-size:11px}
.ln .tx{flex:1 0 auto}
.ln.hl{background:var(--accent-bg); background:color-mix(in srgb, var(--c) 15%, transparent); box-shadow:inset 3px 0 0 var(--c)}
.ln .who{position:sticky; right:6px; flex:none; font:600 10.5px var(--f-mono); color:var(--on-th); background:var(--c); border-radius:4px; padding:0 5px; margin-left:12px}
.box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.box-h{font-size:13px; font-weight:700; color:var(--ink-2); margin-bottom:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.rk{font:600 11.5px var(--f-mono); color:var(--ink-3); letter-spacing:.02em}
.none{color:var(--ink-3); font-size:13px}
.note{color:var(--ink-3); font-size:12.5px}
.th{display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:24px; padding:0 7px; border-radius:6px; background:var(--c); color:var(--on-th); font:600 12px var(--f-mono); vertical-align:middle; white-space:nowrap}
.pill{display:inline-block; font:600 11px var(--f-mono); padding:1px 8px; border-radius:999px; white-space:nowrap; line-height:1.7}
.pill.ok{color:var(--ok); background:var(--ok-bg)} .pill.bad{color:var(--bad); background:var(--bad-bg)}
.pill.wait{color:var(--wait); background:var(--wait-bg)} .pill.idle{color:var(--idle); background:var(--idle-bg)}
.chip{display:inline-flex; align-items:center; font:600 12px var(--f-mono); border:1px solid var(--line-2); background:var(--surface); border-radius:6px; padding:1px 8px; color:var(--ink-2)}
.chg{animation:flash 1.3s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)} 100%{box-shadow:0 0 0 0 transparent}}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px}
.stack-v{display:grid; gap:10px}
@container (max-width: 520px){ .grid2{grid-template-columns:minmax(0, 1fr)} }
.verdict{border-radius:10px; padding:10px 14px; font-size:14.5px; line-height:1.7}
.verdict.bad{background:var(--bad-bg); border:1px solid var(--bad)}
.verdict.ok{background:var(--ok-bg); border:1px solid var(--ok)}
.verdict.idle{background:var(--panel); border:1px solid var(--line)}
.bar{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); transition:width .4s}
.bar.full i{background:var(--bad)}

/* 栈帧：局部变量表 + 操作数栈 */
.lvt{display:grid; gap:4px; margin-top:4px}
.slot{display:grid; grid-template-columns:3.4em minmax(0, 1fr) auto; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:4px 9px; font-size:13.5px}
.slot b{font-family:var(--f-mono); font-weight:600}
.slot .sv{font:700 14px var(--f-mono); color:var(--accent)}
.slot.hot{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg)}
.ops{display:flex; flex-direction:column-reverse; gap:4px; min-height:96px; margin-top:4px; padding:6px; border:1px dashed var(--line-2); border-radius:8px; justify-content:flex-start}
.opi{font:700 14px var(--f-mono); text-align:center; background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:3px 0}
.opi.top{border-color:var(--accent); color:var(--accent)}
.frames{display:flex; flex-direction:column-reverse; gap:5px}
.frm{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:13.5px}
.frm.top{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.frm .note{margin-left:auto}
.cap{display:grid; gap:4px; margin-top:8px}

<script>
(() => {
'use strict';
const TOC = /*TOC_JSON*/null;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const KW = new Set('public private protected static final void int long boolean byte char short double float new synchronized while if else return for try catch true false null volatile this class extends throw'.split(' '));
function hiJava(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b([A-Za-z_][A-Za-z0-9_]*)\b|\b(\d+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="c-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="c-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += KW.has(m[3]) ? '<span class="c-kw">' + m[3] + '</span>' : (/^[A-Z]/.test(m[3]) ? '<span class="c-ty">' + m[3] + '</span>' : m[3]);
    else if (m[4]) out += '<span class="c-num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const TCOL = {T1: 't1', T2: 't2', GC: 't4', '业务': 't2'};
const isChg = (st, k) => !!(st && st.chg && st.chg.includes(k));
const chg = (st, k) => (isChg(st, k) ? ' chg' : '');

function flip(container, update) {
  const before = {};
  if (!RM) $$('[data-flip]', container).forEach(el => { before[el.dataset.flip] = el.getBoundingClientRect(); });
  update();
  if (RM || !container.offsetParent) return;
  $$('[data-flip]', container).forEach(el => {
    if (!el.animate) return;
    const b = before[el.dataset.flip], a = el.getBoundingClientRect();
    if (!b) { el.animate([{opacity: 0, transform: 'scale(.85)'}, {opacity: 1, transform: 'none'}], {duration: 300, easing: 'ease-out'}); return; }
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{transform: 'translate(' + dx + 'px,' + dy + 'px)'}, {transform: 'none'}], {duration: 520, easing: 'cubic-bezier(.2,.75,.2,1)'});
  });
}
function codePanel(p, hl) {
  const marks = {};
  (hl || []).forEach(h => {
    if (h.p !== p.id) return;
    let idx = h.i;
    if (idx == null) {
      idx = p.lines.findIndex(L => L.includes(h.f));
      if (idx < 0 && window.console) console.warn('高亮行没找到：', h.f);
    }
    if (idx >= 0) marks[idx] = h;
  });
  const body = p.lines.map((L, i) => {
    const m = marks[i], col = m ? (TCOL[m.t] || 't1') : '';
    return '<div class="ln' + (m ? ' hl' : '') + '"' + (m ? ' style="--c:var(--' + col + ')"' : '') + '><span class="no">' + (p.nums ? esc(p.nums[i]) : i + 1) + '</span><span class="tx">' + ((p.plain ? esc(L) : hiJava(L)) || ' ') + '</span>' + (m && m.t ? '<span class="who">' + esc(m.t) + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="code"><div class="code-h">' + esc(p.title) + '</div><div class="code-b">' + body + '</div></div>';
}
function scrollHl(col) {
  $$('.code-b', col).forEach(b => {
    const el = $('.hl', b);
    if (!el) return;
    const top = el.offsetTop;
    if (top < b.scrollTop + 8 || top > b.scrollTop + b.clientHeight - 40) b.scrollTop = Math.max(0, top - b.clientHeight / 3);
  });
}

/* ===================== 键盘 / 活动演示 ===================== */
let ACTIVE = null;
const STOPPERS = [];
function setActive(l) { if (ACTIVE === l) return; if (ACTIVE) ACTIVE.classList.remove('is-active'); ACTIVE = l; l.classList.add('is-active'); }
document.addEventListener('pointerdown', e => { const l = e.target.closest('.lab'); if (l) setActive(l); }, true);
document.addEventListener('focusin', e => { const l = e.target.closest('.lab'); if (l) setActive(l); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !ACTIVE || !ACTIVE.offsetParent || !ACTIVE._key) return;
  const tg = e.target, tag = tg && tg.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === ' ' && tag === 'BUTTON') return;
  if (ACTIVE._key(e)) e.preventDefault();
});

/* ===================== 逐步演示引擎 ===================== */
function labTop(cfg) {
  return '<div class="lab-top"><span class="lab-kind">动手</span><h3 class="lab-title">' + cfg.title + '</h3>' + (cfg.intro ? '<p class="lab-intro">' + cfg.intro + '</p>' : '') + '</div>';
}
function segHtml(cfg) {
  return cfg.variants ? '<div class="seg" role="group" aria-label="' + cfg.variantLabel + '">' + cfg.variants.map(v => '<button type="button" data-v="' + v.key + '">' + v.label + '</button>').join('') + '</div>' : '<span></span>';
}
function stepLab(root, cfg) {
  root.classList.add('lab');
  root.innerHTML = labTop(cfg) +
    '<div class="narr" aria-live="polite"><div class="narr-k"></div><p class="narr-t"></p><p class="narr-p"></p></div>' +
    '<div class="ctrl">' + segHtml(cfg) + '<div class="btns"><button type="button" class="btn b-prev" title="上一步（←）">← 上一步</button><button type="button" class="btn b-play" title="自动播放（空格）">▶ 播放</button><button type="button" class="btn primary b-next" title="下一步（→）">下一步 →</button><button type="button" class="btn ghost b-reset" title="回到第一步">重来</button></div></div>' +
    '<ol class="dots"></ol>' +
    '<div class="bench' + (cfg.code ? '' : ' stack') + '">' + (cfg.code ? '<div class="code-col"></div>' : '') + '<div class="stage"></div></div>';
  const q = s => $(s, root);
  const codeCol = q('.code-col'), stage = q('.stage'), K = q('.narr-k'), T = q('.narr-t'), P = q('.narr-p'), dots = q('.dots');
  const bPrev = q('.b-prev'), bNext = q('.b-next'), bPlay = q('.b-play');
  const S = {v: cfg.variants ? cfg.variants[0].key : null, i: 0, timer: null};
  let steps = cfg.steps(S.v);
  function render() {
    const st = steps[S.i];
    if (codeCol) { codeCol.innerHTML = cfg.code(S.v).map(p => codePanel(p, st.hl)).join(''); scrollHl(codeCol); }
    flip(stage, () => { stage.innerHTML = cfg.stage(st.s, st, S.v); });
    K.textContent = (S.i + 1) + ' / ' + steps.length;
    T.textContent = st.t;
    P.innerHTML = st.d;
    dots.innerHTML = steps.map((s, i) => '<li><button type="button" data-i="' + i + '" class="' + (i === S.i ? 'on' : i < S.i ? 'past' : '') + '" aria-label="第 ' + (i + 1) + ' 步：' + esc(s.t) + '"' + (i === S.i ? ' aria-current="step"' : '') + '></button></li>').join('');
    bPrev.disabled = S.i === 0;
    bNext.disabled = S.i === steps.length - 1;
    bPlay.textContent = S.timer ? '⏸ 暂停' : (S.i === steps.length - 1 ? '↻ 重播' : '▶ 播放');
    $$('.seg button', root).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.v ? 'true' : 'false'));
  }
  const go = i => { S.i = Math.max(0, Math.min(steps.length - 1, i)); render(); };
  const stop = () => { if (S.timer) { clearInterval(S.timer); S.timer = null; } };
  function play() {
    if (S.timer) { stop(); render(); return; }
    if (S.i === steps.length - 1) S.i = 0;
    S.timer = setInterval(() => { if (S.i >= steps.length - 1) { stop(); render(); return; } go(S.i + 1); }, 3400);
    render();
  }
  bPrev.onclick = () => { stop(); go(S.i - 1); };
  bNext.onclick = () => { stop(); go(S.i + 1); };
  bPlay.onclick = play;
  q('.b-reset').onclick = () => { stop(); go(0); };
  dots.onclick = e => { const b = e.target.closest('button'); if (b) { stop(); go(+b.dataset.i); } };
  $$('.seg button', root).forEach(b => { b.onclick = () => { stop(); S.v = b.dataset.v; steps = cfg.steps(S.v); S.i = 0; render(); }; });
  root._key = e => {
    if (e.key === 'ArrowRight') { stop(); go(S.i + 1); return true; }
    if (e.key === 'ArrowLeft') { stop(); go(S.i - 1); return true; }
    if (e.key === ' ') { play(); return true; }
    return false;
  };
  STOPPERS.push(() => { if (S.timer) { stop(); render(); } });
  render();
}

/* ===================== 1.3 栈帧：add(3, 4) ===================== */
function frameStage(s) {
  if (s.popped) return '<div class="stack-v"><div class="box"><div class="box-h">' + esc(s.name) + ' 的栈帧</div><p class="none">已弹出，局部变量表和操作数栈随之消失。</p></div><div class="verdict ok">返回值 <b class="mono">' + s.ret + '</b> 交给调用方</div></div>';
  const slots = s.locals.map((l, i) => '<div class="slot' + (s.hot === i ? ' hot' : '') + '"><span class="rk">' + i + ' 号</span><b>' + esc(l.n) + '</b><span class="sv">' + (l.v == null ? '—' : esc(l.v)) + '</span></div>').join('');
  const ops = s.stack.length ? s.stack.map((v, i) => '<div class="opi' + (i === s.stack.length - 1 ? ' top' : '') + '" data-flip="op' + i + '-' + v + '">' + esc(v) + '</div>').join('') : '<span class="none" style="text-align:center">空</span>';
  return '<div class="stack-v"><div class="box"><div class="box-h">' + esc(s.name) + ' 的栈帧<span class="chip">pc = ' + s.pc + '</span></div><div class="grid2"><div><div class="rk">局部变量表 · 抽屉</div><div class="lvt">' + slots + '</div></div><div><div class="rk">操作数栈 · 托盘（上面是栈顶）</div><div class="ops">' + ops + '</div></div></div></div>' +
    (s.note ? '<div class="verdict ' + (s.bad ? 'bad' : 'ok') + '">' + s.note + '</div>' : '') + '</div>';
}
const ADD_CODE = [
  {id: 'src', title: 'Calc.java', lines: ['static int add(int a, int b) {', '    int c = a + b;', '    return c * 2;', '}']},
  {id: 'bc', title: 'javap -c Calc（add 方法）', plain: true, nums: ['0', '1', '2', '3', '4', '5', '6', '7'], lines: ['iload_0', 'iload_1', 'iadd', 'istore_2', 'iload_2', 'iconst_2', 'imul', 'ireturn']}
];
function addSteps() {
  const F = (pc, c, stack, hot) => ({name: 'add(3, 4)', pc, locals: [{n: 'a', v: 3}, {n: 'b', v: 4}, {n: 'c', v: c}], stack, hot});
  const H = (b, s) => [{p: 'bc', i: b}, {p: 'src', i: s}];
  return [
    {t: '调用 add(3, 4)：压入一个新栈帧', d: '参数 3、4 放进 0 号、1 号抽屉。javap 里写着 <b>locals=3</b>，c 的 2 号抽屉也已经留好，只是还没有值。托盘是空的。', hl: [{p: 'src', i: 0}], s: F('—', null, [], null)},
    {t: 'iload_0：把 a 放上托盘', d: '从 0 号抽屉取出 3，压到操作数栈顶。抽屉里的 a 还在，load 只是复制一份。', hl: H(0, 1), s: F(0, null, [3], 0)},
    {t: 'iload_1：把 b 放上托盘', d: '4 压在 3 上面，成为新的栈顶。托盘上同时有两个数，这是本方法操作数栈最深的时候，对应 javap 里的 <b>stack=2</b>。', hl: H(1, 1), s: F(1, null, [3, 4], 1)},
    {t: 'iadd：弹出两个数，相加后放回', d: '取走栈顶的 4 和下面的 3，算出 7 压回去。', hl: H(2, 1), s: F(2, null, [7], null)},

const TL_N = 24;
function tlStage(s) {
  const cells = [];
  for (let i = 0; i < TL_N; i++) {
    const o = s.cells[i], own = s.tl ? Object.keys(s.tl).find(k => s.tl[k].some(([a, b]) => i >= a && i < b)) : null;
    const cls = ['mc'];
    let st = '';
    if (o) { cls.push('obj'); st = '--c:var(--' + TCOL[o.t] + ')'; } else cls.push('free');
    if (own) { cls.push('tl'); if (!o) st = '--c:var(--' + TCOL[own] + ')'; }
    cells.push('<div class="' + cls.join(' ') + '"' + (st ? ' style="' + st + '"' : '') + '>' + (o ? esc(o.n) : '') + '</div>');
  }
  const ptr = [];
  for (let i = 0; i < TL_N; i++) {
    const who = Object.keys(s.ptr || {}).filter(k => s.ptr[k] === i);
    ptr.push('<span' + (who.length === 1 && TCOL[who[0]] ? ' style="--c:var(--' + TCOL[who[0]] + ')"' : '') + '>' + (who.length ? '▲' + who.join('/') : '') + '</span>');
  }
  return '<div class="stack-v"><div class="box"><div class="box-h">Eden（每格代表一小块内存）</div><div class="mem" style="--n:' + TL_N + '">' + cells.join('') + '</div><div class="ptrs" style="--n:' + TL_N + '">' + ptr.join('') + '</div>' +
    (s.tl ? '<p class="note">下划线颜色表示这块内存是哪个线程的 TLAB；▲ 是该线程的分配指针。</p>' : '<p class="note">▲ 是所有线程共用的分配指针 top。</p>') + '</div>' +
    '<div class="cnt"><span>已分配 <b>' + s.cells.filter(Boolean).length + '</b> 个对象</span><span>CAS <b>' + s.cas + '</b> 次</span><span>失败重试 <b>' + s.fail + '</b> 次</span></div></div>';
}

  if (v === 'tlab') {
    const c1 = put(E(), [[0, 'T1', 'a']]);
    const c2 = put(c1, [[8, 'T2', 'b'], [1, 'T1', 'c'], [9, 'T2', 'd'], [2, 'T1', 'e']]);
    const c3 = put(c2, [[3, 'T1', 'f'], [4, 'T1', 'g'], [5, 'T1', 'h'], [6, 'T1', 'i'], [7, 'T1', 'j'], [10, 'T2', 'k']]);
    const c4 = put(c3, [[16, 'T1', 'l']]);
    return [
      {t: 'T1 第一次分配：先领一块 TLAB', d: 'T1 用一次 CAS，从 Eden 里划走 8 格作为自己的 TLAB。', s: {cells: E(), tl: {T1: [[0, 8]]}, ptr: {T1: 0}, cas: 1, fail: 0}},
      {t: 'T2 也领一块', d: '同样一次 CAS。两块 TLAB 互不重叠。', s: {cells: E(), tl: {T1: [[0, 8]], T2: [[8, 16]]}, ptr: {T1: 0, T2: 8}, cas: 2, fail: 0}},
      {t: 'T1 new a：只挪自己的指针', d: '在自己的 TLAB 里分配，就是把自己的指针往后挪一格，<b>不需要任何同步</b>。', s: {cells: c1, tl: {T1: [[0, 8]], T2: [[8, 16]]}, ptr: {T1: 1, T2: 8}, cas: 2, fail: 0}},
      {t: '两个线程同时分配，互不干扰', d: 'T1、T2 交替 new 了 4 个对象，各挪各的指针，CAS 次数没有增加。', s: {cells: c2, tl: {T1: [[0, 8]], T2: [[8, 16]]}, ptr: {T1: 3, T2: 10}, cas: 2, fail: 0}},
      {t: 'T1 的 TLAB 用完了', d: 'T1 又分配了 5 个对象，8 格全部用完；T2 那边还有空间。', s: {cells: c3, tl: {T1: [[0, 8]], T2: [[8, 16]]}, ptr: {T1: 8, T2: 11}, cas: 2, fail: 0}},
      {t: 'T1 再用一次 CAS 领一块新的', d: '只有领新 TLAB 时才需要同步。12 个对象，只用了 3 次 CAS，一次失败都没有。', s: {cells: c4, tl: {T1: [[0, 8], [16, 24]], T2: [[8, 16]]}, ptr: {T1: 17, T2: 11}, cas: 3, fail: 0}}
    ];
  }
  const seq = [['T1', 'a'], ['T2', 'b'], ['T1', 'c'], ['T2', 'd'], ['T2', 'e'], ['T1', 'f'], ['T1', 'g'], ['T2', 'h'], ['T1', 'i'], ['T2', 'j'], ['T1', 'k'], ['T2', 'l']];
  const upto = n => put(E(), seq.slice(0, n).map(([t, nm], i) => [i, t, nm]));
  return [
    {t: '只有一个共用的分配指针', d: '没有 TLAB 时，所有线程都从同一个指针 top 分配。', s: {cells: E(), ptr: {top: 0}, cas: 0, fail: 0}},
    {t: 'T1、T2 同时 new：都读到 top = 0', d: '两个线程都打算把 top 从 0 挪到 1。', s: {cells: E(), ptr: {top: 0}, cas: 0, fail: 0}},
    {t: 'T1 的 CAS 成功', d: 'T1 把 top 从 0 改成 1，a 放在第 0 格。', s: {cells: upto(1), ptr: {top: 1}, cas: 1, fail: 0}},
    {t: 'T2 的 CAS 失败，重读后再试', d: 'T2 期望 top 是 0，实际已经是 1，CAS 失败；重读 top = 1，再 CAS 成功，b 放在第 1 格。', s: {cells: upto(2), ptr: {top: 2}, cas: 3, fail: 1}},
    {t: '之后的每一次分配都要抢同一个指针', d: '分配 12 个对象，至少要 12 次 CAS，线程越多、分配越频繁，失败重试越多（这里的失败次数是示意）。实测 4 个线程时，关掉 TLAB 慢了约 50 倍。', s: {cells: upto(12), ptr: {top: 12}, cas: 17, fail: 5}}
  ];
}

/* ===================== 引用图（可达性、三色标记共用） ===================== */
let GID = 0;
function graphSvg(g, w, h) {
  const uid = 'g' + (++GID) + '-', N = {};
  g.nodes.forEach(n => { N[n.id] = n; });
  const half = n => [(n.w || 76) / 2, 17];
  const edges = g.edges.map(e => {
    const a = N[e.f], b = N[e.t];
    const dx = b.x - a.x, dy = b.y - a.y;
    const clip = (n, sx) => { const [hw, hh] = half(n); const k = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6)); return [n.x + sx * dx * k, n.y + sx * dy * k]; };
    const [x1, y1] = clip(a, 1), [x2, y2] = clip(b, -1);
    const cls = e.s || '';
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    return '<line class="ge ' + cls + '" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" marker-end="url(#' + uid + (cls || 'ok') + ')"/>' + (e.l ? '<text class="glbl" x="' + mx.toFixed(0) + '" y="' + (my - 6).toFixed(0) + '" text-anchor="middle">' + esc(e.l) + '</text>' : '');
  }).join('');
  const nodes = g.nodes.map(n => { const [hw] = half(n); return '<g class="gn ' + (n.c || '') + '"><rect x="' + (n.x - hw) + '" y="' + (n.y - 17) + '" width="' + hw * 2 + '" height="34" rx="8"/><text x="' + n.x + '" y="' + (n.y + 4.5) + '" text-anchor="middle">' + esc(n.label) + '</text></g>'; }).join('');
  const mk = (id, cls) => '<marker id="' + uid + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="' + cls + '"/></marker>';
  return '<svg class="gsvg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="对象引用关系"><defs>' + mk('ok', 'gah') + mk('new', 'gah-new') + mk('del', 'gah-del') + mk('off', 'gah-off') + '</defs>' + edges + nodes + '</svg>';
}

/* ===================== 6.1 三种回收算法 ===================== */
const AL_SWEEP = [['A', 1, 1], ['b', 2, 0], ['C', 1, 1], ['d', 1, 0], ['E', 2, 1], ['f', 1, 0], ['G', 1, 1], ['h', 2, 0], ['I', 1, 1], ['j', 2, 0], ['K', 1, 1], ['m', 1, 0]];
function memRow(items, n) {

function alStage(s) {

}

  const free = k => Array.from({length: k}, () => ({s: 1, c: 'free'}));

      {t: '回收前：内存被占满', d: '16 格内存里放着 12 个对象（有的占 2 格）。接下来想分配一个占 <b>3 格</b>的新对象 X。', s: {rows: [{h: '堆', n: 16, items: objs(AL_SWEEP, 'plain')}]}},
      {t: '标记：找出活对象', d: '从 GC Roots 出发（单元五），绿色是活的，红色是垃圾。大写字母是活对象。', s: {rows: [{h: '堆', n: 16, items: objs(AL_SWEEP, 'mark')}]}}
    ];
    if (v === 'sweep') return head.concat([
      {t: '清除：把垃圾占的地方标成空闲', d: '活对象原地不动，垃圾的位置变成空闲。很快，但空闲空间被切成了好几小段。', s: {rows: [{h: '堆', n: 16, items: objs(AL_SWEEP, 'free')}]}},
      {t: '分配 X（3 格）：失败', d: '空闲一共 9 格，可最大的一段只有 2 格，放不下 3 格的 X。这就是<b>内存碎片</b>。分配时还得查空闲列表找合适的段。', s: {rows: [{h: '堆', n: 16, items: objs(AL_SWEEP, 'free')}], out: '空闲 9 格，最大连续 2 格：X 分配失败，只能再触发一次 GC。', bad: true}}
    ]);
    const live = AL_SWEEP.filter(o => o[2]);
    const packed = live.map(([n, sz]) => ({n, s: sz, c: 'live', f: 'o' + n}));
    return head.concat([
      {t: '整理：把活对象依次挪到一端', d: '活对象向左滑动、紧挨着排好，所有指向它们的引用都要改成新地址。这一步要移动对象，最费时间。', s: {rows: [{h: '堆', n: 16, items: packed.concat(free(16 - 7))}]}},
      {t: '分配 X（3 格）：成功', d: '空闲空间连成一整段，用指针碰撞就能分配。代价是移动了 6 个对象、更新了它们的引用。', s: {rows: [{h: '堆', n: 16, items: packed.concat([{n: 'X', s: 3, c: 'newx'}]).concat(free(6))}], out: '没有碎片，也没有浪费空间；但整理期间业务线程得停着。'}}
    ]);

  const liveCopy = [['A', 1], ['C', 1], ['E', 2]].map(([n, s]) => ({n, s, c: 'live', f: 'o' + n}));

/* ===================== 6.3 对象的一生 ===================== */

/* ===================== 7.3 三色标记 ===================== */
const TC_CODE = {
  none: [{id: 'm', title: '业务线程（和 GC 并发运行）', lines: ['A.ref = C;     // 黑色 A 新增了指向白色 C 的引用', 'B.ref = null;  // 删掉灰色 B 指向 C 的引用']}],
  incr: [{id: 'm', title: '业务线程 + 写屏障（增量更新）', lines: ['A.ref = C;     // 写屏障：A 新增了引用，记下 A', 'B.ref = null;']}],
  satb: [{id: 'm', title: '业务线程 + 写屏障（SATB）', lines: ['A.ref = C;', 'B.ref = null;  // 写屏障：删除前把旧值 C 记下']}]

function tcStage(s) {

function tcSteps(v) {
  const G = (c, e) => ({
    nodes: [{id: 'R', label: 'GC Roots', x: 60, y: 115, w: 96, c: 'root'}, {id: 'A', label: 'A', x: 210, y: 115, c: c.A}, {id: 'B', label: 'B', x: 380, y: 45, c: c.B}, {id: 'C', label: 'C', x: 380, y: 190, c: c.C}],

    {t: 'GC 扫描 A：A 变黑，B 变灰', d: 'A 自己和它的引用都扫完了，染黑；B 被发现但还没扫，染灰。C 还是白的，要等扫描 B 时才能被发现。', s: {g: G({A: 'b', B: 'g', C: 'w'}, [BC])}},
    {t: '业务线程：A.ref = C', d: '<b>条件一</b>：黑色的 A 新增了一条指向白色 C 的引用。A 已经扫完，GC 不会再看它。', hl: H(0), s: {g: G({A: 'b', B: 'g', C: 'w', ...(v === 'incr' ? {A: 'b rec'} : {})}, [BC, AC_NEW]), rec: v === 'incr' ? 'A（新增了引用的黑色对象）' : ''}},
    {t: '业务线程：B.ref = null', d: '<b>条件二</b>：灰色的 B 到 C 的引用被删了。现在只有黑色的 A 指着 C。', hl: H(1), s: {g: G({A: 'b', B: 'g', C: v === 'satb' ? 'g' : 'w', ...(v === 'incr' ? {A: 'b rec'} : {})}, [BC_DEL, AC_NEW]), rec: v === 'incr' ? 'A（新增了引用的黑色对象）' : v === 'satb' ? 'C（被删除的旧引用，按灰色处理）' : ''}}

    {t: '漏标：C 被当成垃圾回收', d: 'C 还是白色，被回收了；可 A 还引用着它，业务线程下次访问 A.ref 就会读到已经释放的内存。', s: {g: G({A: 'b', B: 'b', C: 'dead'}, [AC]), out: '两个条件同时满足，活对象被回收。这是绝对不允许发生的。', bad: true}}

/* ===================== 7.5 G1 ===================== */
const G1_INIT = 'E O F E H H O S O F E O F E O O F E O S O F E F O F F O F F F F'.split(' ');
function g1Stage(s) {
  const cells = s.r.map((r, i) => {
    const g = s.gb && s.gb[i] != null && r === 'O' ? '<small>' + s.gb[i] + '%</small>' : '';
    return '<div class="rc ' + r + (s.sel && s.sel.includes(i) ? ' sel' : '') + '">' + (r === 'F' ? '' : r) + g + '</div>';
  }).join('');
  const count = k => s.r.filter(x => x === k).length;
  return '<div class="stack-v"><div class="box"><div class="box-h">堆：32 个 Region（示意，真实约 2048 个）</div><div class="rg">' + cells + '</div>' +
    '<div class="legend" style="margin-top:8px"><span>E ' + count('E') + '</span><span>S ' + count('S') + '</span><span>O ' + count('O') + '</span><span>H ' + count('H') + '</span><span>空闲 ' + count('F') + '</span>' + (s.gb ? '<span>O 里的百分比：垃圾占比</span>' : '') + '</div></div>' +
    (s.out ? '<div class="verdict ' + (s.bad ? 'bad' : 'ok') + '">' + s.out + '</div>' : '') + '</div>';
}
function g1Steps() {
  const r0 = G1_INIT.slice();
  const r1 = r0.map(x => (x === 'E' || x === 'S' ? 'F' : x));
  [9, 23].forEach(i => { r1[i] = 'S'; });
  r1[25] = 'O';
  const oIdx = r1.map((x, i) => (x === 'O' ? i : -1)).filter(i => i >= 0);
  const GB = [12, 85, 30, 100, 18, 64, 92, 25, 40, 100, 78, 15, 55];
  const gb = {};
  oIdx.forEach((i, k) => { gb[i] = GB[k % GB.length]; });
  const r3 = r1.slice();
  oIdx.forEach(i => { if (gb[i] === 100) r3[i] = 'F'; });
  const gb3 = Object.assign({}, gb);
  oIdx.forEach(i => { if (gb[i] === 100) delete gb3[i]; });
  const left = oIdx.filter(i => r3[i] === 'O').sort((a, b) => gb3[b] - gb3[a]);
  const sel = left.slice(0, 3);
  const r3e = r3.slice();
  [2, 12, 16, 21].forEach(i => { if (r3e[i] === 'F') r3e[i] = 'E'; });
  const r4 = r3e.map((x, i) => (sel.includes(i) || x === 'E' || x === 'S' ? 'F' : x));
  const fr = r4.map((x, i) => (x === 'F' ? i : -1)).filter(i => i >= 0);
  r4[fr[0]] = 'O'; r4[fr[1]] = 'S';
  const gb4 = {};
  Object.keys(gb3).forEach(k => { if (!sel.includes(+k)) gb4[k] = gb3[k]; });
  gb4[fr[0]] = 0;
  const r5 = r4.slice();
  const run = [];
  for (let i = 0; i < r5.length - 2; i++) if (r5[i] === 'F' && r5[i + 1] === 'F' && r5[i + 2] === 'F') { run.push(i, i + 1, i + 2); break; }
  run.forEach(i => { r5[i] = 'H'; });
  return [
    {t: '堆被切成大小相同的 Region', d: '每个 Region 可以是 Eden（E）、Survivor（S）、Old（O）或 Humongous（H）。新生代、老年代不再是连续的两大块。', s: {r: r0}},
    {t: 'Young GC（STW）：清空所有 E 和 S', d: 'Eden 用完时触发。所有 E、S 里的活对象被复制到几个空闲 Region（变成新的 S，年龄够了的进 O），原来的 E、S 整块变空。', s: {r: r1}},
    {t: '并发标记：统计每个 O 里有多少垃圾', d: '堆占用超过阈值（默认 45%）后启动，和业务线程并发进行。结束后，G1 知道了每个老年代 Region 的垃圾占比。', s: {r: r1, gb}},
    {t: 'Remark 和 Cleanup（很短的 STW）', d: '最终标记处理 SATB 记录；清理阶段把 100% 是垃圾的 Region 直接回收，不用复制任何东西。', s: {r: r3, gb: gb3}},
    {t: 'Mixed GC：新生代 + 垃圾最多的几个 O', d: '在停顿目标（MaxGCPauseMillis）允许的范围内，挑出回收价值最高的 3 个老年代 Region（红框），和所有新生代一起回收。', s: {r: r3e, gb: gb3, sel}},
    {t: '回收完成：活对象被搬进空闲 Region', d: '被选中的 Region 里那点活对象被复制到一个新 Region，原来的整块变空。Region 之间是复制，所以 G1 没有碎片。', s: {r: r4, gb: gb4}},
    {t: '大对象：占用连续的 Humongous Region', d: '超过半个 Region 的对象直接放进 H，一个放不下就占连续的几个。', s: {r: r5, gb: gb4, out: 'Young GC → 并发标记 → Mixed GC 循环往复；回收速度跟不上分配速度时，才退化成 Full GC。'}}
  ];
}

  clinit: el => stepLab(el, {title: '准备清零，初始化按顺序赋值', intro: '切换 ① 的位置，对比结果。', variants: [{key: 'orig', label: '① 在最前'}, {key: 'moved', label: '① 在最后'}], variantLabel: '语句顺序', code: v => CL_CODE[v], steps: clSteps, stage: clStage}),
  delegation: el => stepLab(el, {title: '一个加载请求的往返', intro: '请求从下往上一路委托，再从上往下一层层退回来自己找。', variants: [{key: 'plugin', label: '加载 Greeter'}, {key: 'string', label: '加载 java.lang.String'}], variantLabel: '要加载的类', code: () => DG_CODE, steps: dgSteps, stage: dgStage}),
  tlab: el => stepLab(el, {title: '两个线程同时分配对象', intro: '对比有无 TLAB 时，需要同步（CAS）的次数。', variants: [{key: 'tlab', label: '有 TLAB'}, {key: 'cas', label: '没有 TLAB'}], variantLabel: '分配方式', steps: tlSteps, stage: tlStage}),
  layout: layoutLab,
  reach: el => stepLab(el, {title: '从 GC Roots 出发找活对象', intro: '对应 CycleRef：A、B 互相引用，但从根走不到它们。', steps: rcSteps, stage: rcStage}),
  algos: el => stepLab(el, {title: '同一块内存，三种回收方式', intro: '切换算法，看回收后的内存长什么样。', variants: [{key: 'sweep', label: '标记-清除'}, {key: 'copy', label: '复制'}, {key: 'compact', label: '标记-整理'}], variantLabel: '算法', steps: alSteps, stage: alStage}),
  generations: el => stepLab(el, {title: '对象的一生', intro: '从 Eden 出生，在两个 Survivor 之间搬家，到晋升老年代。', steps: gnSteps, stage: gnStage}),
  tricolor: el => stepLab(el, {title: '并发标记时的漏标', intro: '同样两句业务代码，切换写屏障，看 C 的下场。', variants: [{key: 'none', label: '没有屏障'}, {key: 'incr', label: '增量更新'}, {key: 'satb', label: 'SATB'}], variantLabel: '写屏障', code: v => TC_CODE[v], steps: tcSteps, stage: tcStage}),
  g1: el => stepLab(el, {title: 'G1 的一轮回收', intro: '字母是 Region 当前的角色：E 是 Eden，S 是 Survivor，O 是 Old，H 是 Humongous，空白是空闲。', steps: g1Steps, stage: g1Stage})
};
$$('.lab-mount').forEach(el => {
  const f = LABS[el.dataset.lab];
  try { f(el); } catch (err) { el.innerHTML = '<p class="none">这个演示加载失败：' + esc(err.message) + '</p>'; if (window.console) console.error(err); }
});

/* ===================== 代码块高亮 / 复制 ===================== */
$$('pre.codeblock').forEach(pre => {
  const code = $('code', pre), raw = code.textContent;
  if (pre.dataset.lang === 'java') code.innerHTML = raw.split('\n').map(hiJava).join('\n');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'copy'; b.textContent = '复制';
  b.onclick = () => {
    const done = ok => { b.textContent = ok ? '已复制' : '请手动复制'; setTimeout(() => { b.textContent = '复制'; }, 1600); };
    try { navigator.clipboard.writeText(raw).then(() => done(true), () => done(false)); } catch (e) { done(false); }
  };
  pre.insertBefore(b, code);
});

/* ===================== 自测 ===================== */
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 浏览器不允许存储时忽略 */ } }};
function quizProgress(sec) {
  const all = $$('.qz', sec), ok = all.filter(q => $('.qz-cb', q).checked).length, p = $('.qz-progress', sec);
  if (p) p.textContent = ok ? ok + ' / ' + all.length : '';
}
$$('section.quiz').forEach(sec => {
  $$('.qz', sec).forEach(q => {
    const cb = $('.qz-cb', q), btn = $('.qz-show', q), ans = $('.qz-a', q), key = 'jvm-course-' + q.dataset.qid;
    cb.checked = store.get(key) === '1';
    q.classList.toggle('done', cb.checked);
    btn.textContent = '答案';
    btn.onclick = () => { ans.hidden = !ans.hidden; btn.textContent = ans.hidden ? '答案' : '收起'; btn.setAttribute('aria-expanded', String(!ans.hidden)); };
    cb.onchange = () => { store.set(key, cb.checked ? '1' : '0'); q.classList.toggle('done', cb.checked); quizProgress(sec); };
  });
  quizProgress(sec);
});

/* ===================== 首页、目录、翻页 ===================== */
const label = u => (u.cn === '附录' ? '附录' : '单元' + u.cn);
const home = $('#view-home');
home.insertAdjacentHTML('afterbegin', '<header class="home-hero"><div class="eyebrow">Java 虚拟机 · 交互学习版</div><h1>JVM 交互学习手册</h1>' +
  '<p class="lead">从字节码在栈帧里怎么执行，到对象怎么出生、怎么被回收，再到线上问题怎么查。文字讲不清的地方，都做成了可以一步步执行的演示。</p>' +
  '<ol class="unitmap">' + TOC.map(u => '<li><a href="#' + u.id + '"><span class="un">' + label(u) + '</span><span class="nm">' + esc(u.title) + '</span>' + (u.motto ? '<span class="mt">' + esc(u.motto) + '</span>' : '') + '</a></li>').join('') + '</ol></header>');

const toc = $('#toc');
toc.innerHTML = '<a href="#home" class="toc-u" data-u="home">导读</a>' + TOC.map(u => '<div class="toc-unit" data-u="' + u.id + '"><a href="#' + u.id + '" class="toc-u" data-u="' + u.id + '"><span class="toc-n">' + label(u) + '</span>' + esc(u.title) + '</a>' + (u.sections.length ? '<ol class="toc-s">' + u.sections.map(s => '<li><a href="#' + s.id + '" data-s="' + s.id + '">' + esc(s.title) + '</a></li>').join('') + '</ol>' : '') + '</div>').join('');
TOC.forEach((u, i) => {
  const v = $('#view-' + u.id), prev = i === 0 ? ['#home', '导读'] : ['#' + TOC[i - 1].id, label(TOC[i - 1]) + ' ' + TOC[i - 1].title], next = TOC[i + 1] ? ['#' + TOC[i + 1].id, label(TOC[i + 1]) + ' ' + TOC[i + 1].title] : null;
  v.insertAdjacentHTML('beforeend', '<nav class="pager" aria-label="翻页"><a href="' + prev[0] + '"><span>上一篇</span><b>' + esc(prev[1]) + '</b></a>' + (next ? '<a href="' + next[0] + '" style="text-align:right"><span>下一篇</span><b>' + esc(next[1]) + '</b></a>' : '') + '</nav>');
});
home.insertAdjacentHTML('beforeend', '<nav class="pager" aria-label="翻页"><span></span><a href="#' + TOC[0].id + '" style="text-align:right"><span>开始</span><b>' + esc(label(TOC[0]) + ' ' + TOC[0].title) + '</b></a></nav>');
$('#toc-btn').onclick = () => { const s = $('#side'), open = !s.classList.contains('open'); s.classList.toggle('open', open); $('#toc-btn').setAttribute('aria-expanded', String(open)); };

/* ===================== 路由与滚动高亮 ===================== */
let curView = null, spy = null;
function show(view, sec) {
  if (curView !== view) {
    STOPPERS.forEach(f => f());
    $$('.view').forEach(v => { v.hidden = v.dataset.view !== view; });
    curView = view;
    $$('.toc-u').forEach(a => a.classList.toggle('on', a.dataset.u === view));
    $$('.toc-unit').forEach(d => d.classList.toggle('open', d.dataset.u === view));
    setupSpy(view);
  }
  $('#side').classList.remove('open'); $('#toc-btn').setAttribute('aria-expanded', 'false');
  const target = sec && document.getElementById(sec);
  if (target) target.scrollIntoView({block: 'start'}); else window.scrollTo(0, 0);
}
function setupSpy(view) {
  if (spy) spy.disconnect();
  if (!('IntersectionObserver' in window)) return;
  const secs = $$('#view-' + view + ' section[id]');
  spy = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      $$('.toc-s a').forEach(a => a.classList.toggle('on', a.dataset.s === en.target.id));
    });
  }, {rootMargin: '0px 0px -70% 0px'});
  secs.forEach(s => spy.observe(s));
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(u\d+)(?:-[a-z0-9]+)?$/);
  if (m && document.getElementById('view-' + m[1])) show(m[1], h === m[1] ? null : h);
  else show('home', null);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const h = a.getAttribute('href');
  if (h === location.hash) { e.preventDefault(); route(); }
});
window.addEventListener('hashchange', route);
route();
})();
</script>
