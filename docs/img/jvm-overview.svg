<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="t">
<title id="t">JVM 全景：类加载子系统、运行时数据区、执行引擎</title>
<style>
.bg{fill:#ffffff}.ink{fill:#152033}.ink2{fill:#47546c}.ink3{fill:#76829a}
.box{fill:#f6f8fb;stroke:#b9c3d2;stroke-width:1.2}
.area{fill:#f6f8fb;stroke:#76829a;stroke-width:1.4}
.sh{fill:rgba(43,85,196,.09);stroke:#2b55c4;stroke-width:1.4}
.pv{fill:rgba(13,132,117,.09);stroke:#0d8475;stroke-width:1.4}
.en{fill:rgba(177,58,109,.08);stroke:#b13a6d;stroke-width:1.4}
.ex{fill:#ffffff;stroke:#8a5a22;stroke-width:1.4;stroke-dasharray:5 4}
.cell{fill:#ffffff;stroke:#b9c3d2;stroke-width:1}
.ar{stroke:#47546c;stroke-width:1.6;fill:none}
.ah{fill:#47546c}
.t-sh{fill:#2b55c4}.t-pv{fill:#0d8475}.t-en{fill:#b13a6d}.t-ex{fill:#8a5a22}
text{font-size:13px}.h{font-size:15px;font-weight:700}.s{font-size:12px}.m{font-family:Menlo,Consolas,monospace;font-size:12px}
@media (prefers-color-scheme: dark){
.bg{fill:#151c27}.ink{fill:#e4e9f1}.ink2{fill:#a6b1c3}.ink3{fill:#7d899d}
.box,.area{fill:#1a2230;stroke:#3d495b}.cell{fill:#151c27;stroke:#3d495b}
.sh{fill:rgba(134,166,255,.12);stroke:#86a6ff}.pv{fill:rgba(79,207,189,.12);stroke:#4fcfbd}.en{fill:rgba(240,139,182,.12);stroke:#f08bb6}
.ex{fill:#151c27;stroke:#d9a46a}.ar{stroke:#a6b1c3}.ah{fill:#a6b1c3}
.t-sh{fill:#86a6ff}.t-pv{fill:#4fcfbd}.t-en{fill:#f08bb6}.t-ex{fill:#d9a46a}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" width="860" height="540" rx="12"/>
<!-- 第一行：编译与加载 -->
<rect class="box" x="20" y="20" width="130" height="50" rx="8"/><text class="ink m" x="85" y="50" text-anchor="middle">Calc.java</text>
<line class="ar" x1="150" y1="45" x2="222" y2="45" marker-end="url(#a)"/><text class="ink3 s" x="186" y="37" text-anchor="middle">javac</text>
<rect class="box" x="225" y="20" width="150" height="50" rx="8"/><text class="ink m" x="300" y="42" text-anchor="middle">Calc.class</text><text class="ink3 s" x="300" y="60" text-anchor="middle">字节码</text>
<line class="ar" x1="375" y1="45" x2="447" y2="45" marker-end="url(#a)"/>
<rect class="en" x="450" y="14" width="390" height="62" rx="8"/><text class="t-en h" x="470" y="40">类加载子系统</text><text class="ink2 s" x="470" y="62">加载 → 验证 → 准备 → 解析 → 初始化（单元三）</text>
<!-- 运行时数据区 -->
<rect class="area" x="20" y="100" width="820" height="290" rx="12"/>
<line class="ar" x1="560" y1="78" x2="196" y2="136" marker-end="url(#a)"/>
<text class="ink h" x="40" y="126">运行时数据区</text><text class="ink3 s" x="146" y="126">（单元二）</text>
<text class="t-sh s" x="820" y="126" text-anchor="end">所有线程共享</text>
<rect class="sh" x="40" y="138" width="300" height="104" rx="9"/>
<text class="t-sh h" x="56" y="164">方法区（元空间）</text>
<text class="ink2 s" x="56" y="188">类的元数据：字段、方法、字节码</text>
<text class="ink2 s" x="56" y="208">运行时常量池</text>
<text class="ink3 s" x="56" y="228">JDK 8 起放在本地内存</text>
<rect class="sh" x="356" y="138" width="464" height="104" rx="9"/>
<text class="t-sh h" x="372" y="164">堆</text><text class="ink2 s" x="396" y="164">对象实例、数组、字符串常量池、静态变量</text>
<rect class="cell" x="372" y="178" width="150" height="44" rx="5"/><text class="ink s" x="447" y="205" text-anchor="middle">Eden</text>
<rect class="cell" x="526" y="178" width="36" height="44" rx="5"/><text class="ink s" x="544" y="205" text-anchor="middle">S0</text>
<rect class="cell" x="566" y="178" width="36" height="44" rx="5"/><text class="ink s" x="584" y="205" text-anchor="middle">S1</text>
<rect class="cell" x="606" y="178" width="198" height="44" rx="5"/><text class="ink s" x="705" y="205" text-anchor="middle">老年代</text>
<text class="ink3 s" x="372" y="236">新生代</text>
<text class="t-pv s" x="40" y="264">每个线程一份，随线程生灭</text>
<!-- 线程 1 -->
<rect class="pv" x="40" y="274" width="380" height="102" rx="9"/>
<text class="t-pv h" x="56" y="298">线程 1</text>
<rect class="cell" x="56" y="308" width="150" height="58" rx="5"/><text class="ink s" x="131" y="326" text-anchor="middle">虚拟机栈</text>
<rect class="box" x="68" y="334" width="126" height="12" rx="3"/><rect class="box" x="68" y="348" width="126" height="12" rx="3"/>
<rect class="cell" x="214" y="308" width="104" height="58" rx="5"/><text class="ink s" x="266" y="342" text-anchor="middle">本地方法栈</text>
<rect class="cell" x="326" y="308" width="82" height="58" rx="5"/><text class="ink s" x="367" y="334" text-anchor="middle">程序</text><text class="ink s" x="367" y="352" text-anchor="middle">计数器</text>
<!-- 线程 2 -->
<rect class="pv" x="440" y="274" width="380" height="102" rx="9"/>
<text class="t-pv h" x="456" y="298">线程 2</text>
<rect class="cell" x="456" y="308" width="150" height="58" rx="5"/><text class="ink s" x="531" y="326" text-anchor="middle">虚拟机栈</text>
<rect class="box" x="468" y="334" width="126" height="12" rx="3"/><rect class="box" x="468" y="348" width="126" height="12" rx="3"/>
<rect class="cell" x="614" y="308" width="104" height="58" rx="5"/><text class="ink s" x="666" y="342" text-anchor="middle">本地方法栈</text>
<rect class="cell" x="726" y="308" width="82" height="58" rx="5"/><text class="ink s" x="767" y="334" text-anchor="middle">程序</text><text class="ink s" x="767" y="352" text-anchor="middle">计数器</text>
<!-- 执行引擎 -->
<line class="ar" x1="330" y1="412" x2="330" y2="392" marker-end="url(#a)"/>
<line class="ar" x1="350" y1="392" x2="350" y2="412" marker-end="url(#a)"/>
<rect class="en" x="20" y="414" width="610" height="106" rx="12"/>
<text class="t-en h" x="40" y="440">执行引擎</text>
<rect class="cell" x="40" y="452" width="170" height="52" rx="6"/><text class="ink s" x="125" y="474" text-anchor="middle">解释器</text><text class="ink3 s" x="125" y="492" text-anchor="middle">逐条执行字节码</text>
<rect class="cell" x="224" y="452" width="180" height="52" rx="6"/><text class="ink s" x="314" y="474" text-anchor="middle">JIT 编译器</text><text class="ink3 s" x="314" y="492" text-anchor="middle">热点代码 → 机器码</text>
<rect class="cell" x="418" y="452" width="196" height="52" rx="6"/><text class="ink s" x="516" y="474" text-anchor="middle">垃圾收集器</text><text class="ink3 s" x="516" y="492" text-anchor="middle">回收堆里的垃圾</text>
<path class="ar" d="M516 452 V 402 H 430 V 246" marker-end="url(#a)"/>
<!-- 直接内存 -->
<rect class="ex" x="650" y="414" width="190" height="106" rx="12"/>
<text class="t-ex h" x="666" y="440">直接内存</text>
<text class="ink2 s" x="666" y="464">堆外，不属于</text>
<text class="ink2 s" x="666" y="482">运行时数据区</text>
<text class="ink3 s" x="666" y="504">NIO 缓冲区</text>
</svg>
