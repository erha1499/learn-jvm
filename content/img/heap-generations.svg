<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="t">
<title id="t">堆的分代：Eden、两个 Survivor 和老年代</title>
<style>
.bg{fill:#ffffff}.ink{fill:#152033}.ink2{fill:#47546c}.ink3{fill:#76829a}
.eden{fill:rgba(43,85,196,.10);stroke:#2b55c4;stroke-width:1.4}
.sv{fill:rgba(13,132,117,.12);stroke:#0d8475;stroke-width:1.4}
.sv2{fill:none;stroke:#0d8475;stroke-width:1.4;stroke-dasharray:5 4}
.old{fill:rgba(138,90,34,.10);stroke:#8a5a22;stroke-width:1.4}
.brace{stroke:#76829a;stroke-width:1.2;fill:none}
.ar{stroke:#47546c;stroke-width:1.6;fill:none}.ah{fill:#47546c}
.t-e{fill:#2b55c4}.t-s{fill:#0d8475}.t-o{fill:#8a5a22}
text{font-size:13px}.h{font-size:15px;font-weight:700}.s{font-size:12px}
@media (prefers-color-scheme: dark){
.bg{fill:#151c27}.ink{fill:#e4e9f1}.ink2{fill:#a6b1c3}.ink3{fill:#7d899d}
.eden{fill:rgba(134,166,255,.13);stroke:#86a6ff}.sv{fill:rgba(79,207,189,.14);stroke:#4fcfbd}.sv2{stroke:#4fcfbd}
.old{fill:rgba(217,164,106,.13);stroke:#d9a46a}.brace{stroke:#7d899d}.ar{stroke:#a6b1c3}.ah{fill:#a6b1c3}
.t-e{fill:#86a6ff}.t-s{fill:#4fcfbd}.t-o{fill:#d9a46a}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" width="860" height="270" rx="12"/>
<path class="brace" d="M30 46 v-10 h258 v10"/><text class="ink2 s" x="159" y="28" text-anchor="middle">新生代 1/3：每次 GC 大部分是垃圾 → 复制算法</text>
<path class="brace" d="M300 46 v-10 h530 v10"/><text class="ink2 s" x="565" y="28" text-anchor="middle">老年代 2/3：大部分还活着 → 标记-清除 / 标记-整理</text>
<rect class="eden" x="30" y="54" width="200" height="90" rx="8"/><text class="t-e h" x="130" y="94" text-anchor="middle">Eden</text><text class="ink3 s" x="130" y="116" text-anchor="middle">8 份 · 新对象在这里出生</text>
<rect class="sv" x="236" y="54" width="25" height="90" rx="5"/><text class="t-s s" x="248" y="104" text-anchor="middle">S0</text>
<rect class="sv2" x="265" y="54" width="25" height="90" rx="5"/><text class="t-s s" x="277" y="104" text-anchor="middle">S1</text>
<rect class="old" x="300" y="54" width="530" height="90" rx="8"/><text class="t-o h" x="565" y="94" text-anchor="middle">老年代</text><text class="ink3 s" x="565" y="116" text-anchor="middle">熬过多次 GC 的对象、大对象</text>
<path class="ar" d="M130 146 C 130 196, 250 196, 274 148" marker-end="url(#a)"/>
<text class="ink s" x="40" y="214">① Minor GC：Eden 和 S0 里的活对象</text>
<text class="ink s" x="40" y="232">复制到空着的 S1，年龄 +1，然后 S0、S1 互换</text>
<path class="ar" d="M262 146 C 300 220, 420 220, 470 148" marker-end="url(#a)"/>
<text class="ink s" x="420" y="214">② 年龄到阈值（默认 15）、Survivor 放不下、</text>
<text class="ink s" x="420" y="232">动态年龄判断 → 晋升老年代</text>
<text class="ink3 s" x="420" y="254">大对象可直接在老年代分配</text>
</svg>
